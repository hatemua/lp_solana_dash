# LP Solana Dash. Postgres, Redis and the executor are on the internal network only (no published ports).
# Run from the repo root:  docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: lpdash

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lp} -d ${POSTGRES_DB:-lp}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  executor:
    build: ../executor
    restart: unless-stopped
    environment:
      EXECUTOR_PORT: 8200
      RPC_URL: ${RPC_URL:-}
      RPC_BACKUP_URL: ${RPC_BACKUP_URL:-}
    networks: [internal]

  indexer:
    build: ../indexer
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lp}
      REDIS_URL: redis://redis:6379/0
      EXECUTOR_URL: http://executor:8200
      WATCH_POOLS_N: ${WATCH_POOLS_N:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8001:8001"   # health, localhost only (the API exposes it publicly in M2)
    networks: [internal]

  api:
    build: ../api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lp}
      REDIS_URL: redis://redis:6379/0
      EXECUTOR_URL: http://executor:8200
      INDEXER_HEALTH_URL: http://indexer:8001/health
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://lp.joulity.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://lp.api.joulity.com}
      WEB_URL: ${WEB_URL:-https://lp.joulity.com}
      SIGNUP_OPEN: ${SIGNUP_OPEN:-true}
    ports:
      - "127.0.0.1:8000:8000"   # nginx (host) terminates TLS for lp.api.joulity.com
    networks: [internal]

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://lp.api.joulity.com}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # nginx (host) terminates TLS for lp.joulity.com
    networks: [internal]

  bot:
    build: ../bot
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lp}
      REDIS_URL: redis://redis:6379/0
      EXECUTOR_URL: http://executor:8200
      BOT_MODE: paper                # hard-coded: the bot has no wallet and no keys (no key file is mounted)
      STRATEGIES: ${BOT_STRATEGIES:-topped_bid,meridian,chop_spot,topped_bid_v2,evil_panda,grid,fee_leader,meridian_trail,rabbit}
      POSITION_USD: ${BOT_POSITION_USD:-100}
      MAX_OPEN_PER_STRATEGY: ${BOT_MAX_OPEN:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [internal]

  mcp:
    build: ../mcp
    restart: unless-stopped
    depends_on: [api]
    environment:
      MCP_PORT: 8100
      API_URL: http://api:8000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://lp.api.joulity.com}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}   # optional static token for scripts; OAuth is the normal way in
    ports:
      - "127.0.0.1:8100:8100"   # nginx (host) serves it at https://lp.api.joulity.com/mcp
    networks: [internal]

volumes:
  pgdata:
  redisdata:

networks:
  internal:
